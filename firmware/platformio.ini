; Configuración PlatformIO — NEO Robot Asistente
; Placa: Le-ESP32-S3-Lipo de Ledo Electronics (módulo ESP32-S3-WROOM)
; Framework: Arduino

[common]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    links2004/WebSockets @ ^2.7.0
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial → UART0 (CH340C → COM)
board_build.arduino.memory_type = qio_opi
board_build.partitions = min_spiffs.csv
test_build_src = yes

; ------------------------------------------------------------
; Firmware principal (incluye inferencia TFLite Micro)
; ------------------------------------------------------------
[env:esp32dev]
extends = common
; Excluye demos/ y dataset/ para que no haya conflicto de main()
build_src_filter = +<*> -<demos/> -<dataset/>
lib_deps =
    ${common.lib_deps}
    https://github.com/espressif/esp-tflite-micro
; El library.json de esp-tflite-micro no declara las rutas third_party.
; Estas rutas las define el CMakeLists.txt del componente IDF (INCLUDE_DIRS).
; En PlatformIO Arduino hay que declararlas manualmente.
build_flags =
    ${common.build_flags}
    -I.pio/libdeps/esp32dev/esp-tflite-micro/third_party/flatbuffers/include
    -I.pio/libdeps/esp32dev/esp-tflite-micro/third_party/gemmlowp
    -I.pio/libdeps/esp32dev/esp-tflite-micro/third_party/ruy
    -I.pio/libdeps/esp32dev/esp-tflite-micro/third_party/kissfft
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    ; TEMPORAL: prueba el wake word sin WiFi/servidor. Quitar tras validar.
    -DNEO_TEST_WAKE_OFFLINE
    -Wno-shadow
    -Wno-sign-compare
    -Wno-double-promotion
    -Wno-missing-field-initializers
    -Wno-type-limits

; ------------------------------------------------------------
; Test mínimo: wake word con solo micrófono + OLED (Fase 4.3)
; Sin WiFi, sin WebSocket, sin speaker, sin tareas FreeRTOS extra.
; La inferencia corre sincrónica en el loop principal (Core 1).
; Flashear: pio run -e wake_word_test --target upload
; Monitor:  pio device monitor -e wake_word_test
; ------------------------------------------------------------
[env:wake_word_test]
extends = common
; Mismo build_src_filter que esp32dev (todo incluido) para evitar error de compilación
; en inference.cpp con TFLite. El main mínimo está en demos/wake_word/.
; NOTA: Este env usa todo el código fuente, pero main_wake_word.cpp solo usa
; mic + OLED + inferencia (sin WiFi, WS, speaker, trigger, ni tareas extra).
build_src_filter = +<*> -<demos/> -<dataset/> +<demos/wake_word/> -<main.cpp>
lib_deps =
    ${common.lib_deps}
    https://github.com/espressif/esp-tflite-micro
build_flags =
    ${common.build_flags}
    -I.pio/libdeps/wake_word_test/esp-tflite-micro/third_party/flatbuffers/include
    -I.pio/libdeps/wake_word_test/esp-tflite-micro/third_party/gemmlowp
    -I.pio/libdeps/wake_word_test/esp-tflite-micro/third_party/ruy
    -I.pio/libdeps/wake_word_test/esp-tflite-micro/third_party/kissfft
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -Wno-shadow
    -Wno-sign-compare
    -Wno-double-promotion
    -Wno-missing-field-initializers
    -Wno-type-limits

; ------------------------------------------------------------
; Firmware de captura de dataset (Fase 4.x — pre-entrenamiento)
; Flashear: pio run -e dataset_capture --target upload
; Monitor:  pio device monitor -e dataset_capture
; ------------------------------------------------------------
[env:dataset_capture]
extends = common
; Solo incluye los módulos necesarios (sin main.cpp, sin red, sin comandos)
build_src_filter = -<*> +<audio/> +<display/> +<input/> +<dataset/>

; ------------------------------------------------------------
; Demo: ojos reactivos al volumen
; Para flashear: pio run -e demo_ojos --target upload
; ------------------------------------------------------------
[env:demo_ojos]
extends = common
build_src_filter = +<display/> +<audio/> +<demos/ojos/>

; ------------------------------------------------------------
; Demo: reproducción de voz humana por el altavoz
; Prerequisito: ejecutar tools/gen_frase.py antes de compilar
; Para flashear: pio run -e demo_bocina --target upload
; ------------------------------------------------------------
[env:demo_bocina]
extends = common
build_src_filter = +<display/> +<audio/> +<demos/bocina/>

